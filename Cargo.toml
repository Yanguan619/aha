[package]
name = "aha"
version = "0.2.6"
edition = "2024"
repository = "https://github.com/jhqxxx/aha"
license = "Apache-2.0"
description = "aha model inference library, now supports Qwen(2.5VL/3/3VL/3.5/ASR/3Embedding/3Reranker), MiniCPM(4/5), VoxCPM(0.5B/1.5/2), DeepSeek-OCR/2, Hunyuan-OCR, PaddleOCR-VL/1.5/1.6, RMBG2.0, GLM(ASR-Nano-2512/OCR), Fun-ASR-Nano-2512, LFM(2/2.5/2VL/2.5VL), SenseVoice/Kokoro (sherpa-onnx)"

[dependencies]
candle-core = { version = "0.11" }
candle-nn = { version = "0.11" }
candle-transformers = { version = "0.11" }
candle-flash-attn = { version = "0.11", optional = true }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
anyhow = "1.0.100"
ffmpeg-next = { version = "8.0.0", optional = true }
image = "0.25.8"
reqwest = { version = "0.13", features = ["blocking"] }
base64 = "0.22.1"
num = "0.4.3"
minijinja = "2.12.0"
tokenizers = "0.22.1"
uuid = { version = "1.18.1", features = ["v4"] }
axum = { version = "0.8.8", features = ["multipart"] }
futures-util = "0.3.31"
async-stream = "0.3.6"
tower-http = { version = "0.6.7", features = ["trace"] }
tokio = { version = "1.47.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
    "time",
] }
hound = "3.5.1"
clap = { version = "4.5.51", features = ["derive"] }
modelscope = "0.1.5"
dirs = "6.0.0"
sysinfo = "0.33"
url = "2.5.7"
rayon = "1.10"
# rubato = "1.0.0"
# audioadapter-buffers = "2.0.0"
realfft = "3.5.0"
symphonia = { version = "0.5.5", features = ["mp3", "wav"] }
serde_yaml = "0.9.34"
zip = "8.5.1"
half = "2.7.1"
byteorder = "1.5.0"
sentencepiece = "0.13.1"
ahash = "0.8.12"
derive_builder = "0.20.2"
kaldi-native-fbank = "0.1.0"
rand = "0.10.1"
esaxx-rs = "0.1.10"
# 日志宏（sherpa 模型下载进度 / 桌宠端点）；没装 subscriber 时是 no-op。
tracing = "0.1"
# Optional: sherpa-onnx (SenseVoice ASR / Kokoro TTS). Enable with `--features sherpa`.
# 注意必须是 **shared**（动态链接）：sherpa 静态库里内嵌了 protobuf，而 aha 又依赖
# sentencepiece（也内嵌 protobuf），两个静态库合进一个 exe 会 LNK2005 重复符号。
# 代价是发行包里 aha.exe 旁边要带 sherpa-onnx 的 DLL（build-release.ps1 会拷）。
sherpa-onnx = { version = "2.0.1", optional = true, default-features = false }
# Optional: Laya decision model (sys1 / candle), served by the `route` endpoint.
sys1 = { version = "0.0.3", optional = true, default-features = false, features = ["cpu"] }

[target.'cfg(windows)'.dependencies]
# --parent-pid watchdog: 桌宠退出时跟着收工（移植自旧 asr/tts/laya-route）。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }


[features]
flash-attn = ["candle-flash-attn"]
cuda = ["candle-nn/cuda", "candle-core/cuda", "candle-transformers/cuda"]
metal = ["candle-nn/metal", "candle-core/metal", "candle-transformers/metal"]
ffmpeg = ["ffmpeg-next"]
sherpa = ["dep:sherpa-onnx", "sherpa-onnx/shared"]
# Laya 决策模型：CPU 是默认编译特征；要 GPU 用 laya-cuda（sys1 的 cuda 是三选一互斥的）。
laya = ["dep:sys1"]
laya-cuda = ["dep:sys1", "sys1/cuda", "cuda"]
# 可选：TurboVLA（视觉-语言-动作）。基于 candle 的 BERT/DINOv3 + 自写融合/动作头。
vla = []
# 可选：让 candle 的 CPU matmul 走 Intel MKL（比纯 Rust gemm 快，用来补 Laya CPU 的差距）。
# 代价：intel-mkl-src 首次构建要下载 ~1GB MKL，静态链接会让 exe 明显变大。
mkl = ["candle-core/mkl", "candle-nn/mkl"]

[lints.clippy]
needless_range_loop = "allow"
single_range_in_vec_init = "allow"
manual_div_ceil = "allow"

# VLA 自检/对齐工具只在开了 vla 特性时编译
[[example]]
name = "turbovla_check"
required-features = ["vla"]

[[example]]
name = "turbovla_dump"
required-features = ["vla"]

[[example]]
name = "turbovla_action"
required-features = ["vla"]

